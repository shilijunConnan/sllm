[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sllm"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "httpx>=0.28.1",
    "networkx>=3.2.1",
    "numpy==1.26.4",
    "packaging>=26.2",
    "pillow>=11.3.0",
    "safetensors>=0.7.0",
    "sympy>=1.14.0",
    "transformers==4.46.3",
    "uvicorn",
]
[tool.setuptools]
package-dir = {"sllm" = "."}
packages = [
    "sllm.cuda",
    "sllm.core",
    "sllm.engine",
    "sllm.models",
    "sllm.processor",
    "sllm.runner",
    "sllm.server",
    "sllm.utils"
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true # 将其设为默认源
